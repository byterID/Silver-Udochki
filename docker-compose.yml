x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    app:
        build:
            context: .
            target: runtime
        container_name: silver-udochki-app
        restart: unless-stopped
        environment:
            RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
        volumes:
            - ./.env:/var/www/.env:ro           # .env с хоста, в образ не попадает
            - app-storage:/var/www/storage/app  # загруженные файлы
        depends_on:
            db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging: *logging

    web:
        build:
            context: .
            target: web
        container_name: silver-udochki-web
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/snippets:/etc/nginx/snippets:ro
            - app-storage:/var/www/storage/app:ro
            - ./docker/certbot/conf:/etc/letsencrypt:ro
            - ./docker/certbot/www:/var/www/certbot:ro
        depends_on:
            - app
        security_opt:
            - no-new-privileges:true
        logging: *logging

    db:
        image: postgres:17-alpine
        container_name: silver-udochki-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${DB_DATABASE:?укажите DB_DATABASE в .env}"
            POSTGRES_USER: "${DB_USERNAME:?укажите DB_USERNAME в .env}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:?укажите DB_PASSWORD в .env}"
        # Для SSH-туннеля:
        # ports:
        #     - "127.0.0.1:5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 10
        logging: *logging

    node:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - .:/app
        command: sh -c "npm ci && npm run build"
        profiles: ["tools"]

    kafka-init:
        image: busybox:1.37
        command: ["chown", "-R", "1000:1000", "/var/lib/kafka/data"]
        volumes:
            - kafka-data:/var/lib/kafka/data
        restart: "no"

    kafka:
        image: apache/kafka:4.1.0
        container_name: silver-udochki-kafka
        restart: unless-stopped
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
            KAFKA_LOG_RETENTION_HOURS: 168
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
        volumes:
            - kafka-data:/var/lib/kafka/data
        mem_limit: 700m
        # портов наружу НЕТ: доступ только из docker-сети
        security_opt:
            - no-new-privileges:true
        logging: *logging
        depends_on:
            kafka-init:
                condition: service_completed_successfully

    task-worker:
        build:
            context: .
            target: runtime
        restart: unless-stopped
        command: ["php", "artisan", "tasks:consume"]
        environment:
            RUN_MIGRATIONS: "false"
        volumes:
            - ./.env:/var/www/.env:ro
            - app-storage:/var/www/storage/app
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started
        stop_grace_period: 90s
        mem_limit: 256m
        security_opt:
            - no-new-privileges:true
        logging: *logging
        user: www-data

    scheduler:
        build:
            context: .
            target: runtime
        container_name: silver-udochki-scheduler
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        environment:
            RUN_MIGRATIONS: "false"
        volumes:
            - ./.env:/var/www/.env:ro
            - app-storage:/var/www/storage/app
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started
        mem_limit: 128m
        security_opt:
            - no-new-privileges:true
        logging: *logging
        user: www-data

    task-notifier:
        build:
            context: .
            target: runtime
        container_name: silver-udochki-task-notifier
        restart: unless-stopped
        command: ["php", "artisan", "tasks:notify"]
        environment:
            RUN_MIGRATIONS: "false"
        volumes:
            - ./.env:/var/www/.env:ro
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started
        mem_limit: 128m
        security_opt:
            - no-new-privileges:true
        logging: *logging
        user: www-data

volumes:
    app-storage:
    db-data:
    kafka-data:
