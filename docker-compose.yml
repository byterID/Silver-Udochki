x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    app:
        build:
            context: .
            target: runtime
        container_name: silver-udochki-app
        restart: unless-stopped
        environment:
            RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
        volumes:
            - ./.env:/var/www/.env:ro           # .env с хоста, в образ не попадает
            - app-storage:/var/www/storage/app  # загруженные файлы
        depends_on:
            db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging: *logging

    web:
        build:
            context: .
            target: web
        container_name: silver-udochki-web
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/snippets:/etc/nginx/snippets:ro
            - app-storage:/var/www/storage/app:ro
            - ./docker/certbot/conf:/etc/letsencrypt:ro
            - ./docker/certbot/www:/var/www/certbot:ro
        depends_on:
            - app
        security_opt:
            - no-new-privileges:true
        logging: *logging

    db:
        image: postgres:17-alpine
        container_name: silver-udochki-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${DB_DATABASE:?укажите DB_DATABASE в .env}"
            POSTGRES_USER: "${DB_USERNAME:?укажите DB_USERNAME в .env}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:?укажите DB_PASSWORD в .env}"
        # Для SSH-туннеля:
        # ports:
        #     - "127.0.0.1:5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 10
        logging: *logging

    node:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - .:/app
        command: sh -c "npm ci && npm run build"
        profiles: ["tools"]

        # ---------- Мониторинг ----------
    node-exporter:
        image: prom/node-exporter:v1.9.1
        container_name: silver-udochki-node-exporter
        restart: unless-stopped
        network_mode: host          # видим реальную сеть хоста
        pid: host                   # видим реальные процессы хоста
        volumes:
            - /:/host:ro,rslave
        command:
            - --path.rootfs=/host
            - --web.listen-address=${MONITORING_BIND_IP:?укажите MONITORING_BIND_IP в .env}:9100
        security_opt:
            - no-new-privileges:true
        logging: *logging

    cadvisor:
        image: ghcr.io/google/cadvisor:v0.60.6
        container_name: silver-udochki-cadvisor
        restart: unless-stopped
        privileged: true
        devices:
            - /dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        command:
            - --docker_only=true
            - --housekeeping_interval=30s
            - --store_container_labels=false
            - --containerd-namespace=moby
        ports:
            - "${MONITORING_BIND_IP:?}:8081:8080"
        logging: *logging

    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.17.1
        container_name: silver-udochki-postgres-exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_URI: "db:5432/${DB_DATABASE}?sslmode=disable"
            DATA_SOURCE_USER: monitoring
            DATA_SOURCE_PASS: "${MONITORING_DB_PASSWORD:?укажите MONITORING_DB_PASSWORD в .env}"
        ports:
            - "${MONITORING_BIND_IP:?}:9187:9187"
        depends_on:
            db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging: *logging

    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:1.4.2
        container_name: silver-udochki-nginx-exporter
        restart: unless-stopped
        command:
            - --nginx.scrape-uri=http://web:8080/stub_status
        ports:
            - "${MONITORING_BIND_IP:?}:9113:9113"
        depends_on:
            - web
        security_opt:
            - no-new-privileges:true
        logging: *logging
        
volumes:
    app-storage:
    db-data:
