x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    app:
        build:
            context: .
            target: runtime
        container_name: silver-udochki-app
        restart: unless-stopped
        environment:
            RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
        volumes:
            - ./.env:/var/www/.env:ro           # .env с хоста, в образ не попадает
            - app-storage:/var/www/storage/app  # загруженные файлы
        depends_on:
            db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging: *logging

    web:
        build:
            context: .
            target: web
        container_name: silver-udochki-web
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/snippets:/etc/nginx/snippets:ro
            - app-storage:/var/www/storage/app:ro
            - ./docker/certbot/conf:/etc/letsencrypt:ro
            - ./docker/certbot/www:/var/www/certbot:ro
        depends_on:
            - app
        security_opt:
            - no-new-privileges:true
        logging: *logging

    db:
        image: postgres:17-alpine
        container_name: silver-udochki-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${DB_DATABASE:?укажите DB_DATABASE в .env}"
            POSTGRES_USER: "${DB_USERNAME:?укажите DB_USERNAME в .env}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:?укажите DB_PASSWORD в .env}"
        # Для SSH-туннеля:
        # ports:
        #     - "127.0.0.1:5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 10
        logging: *logging

    node:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - .:/app
        command: sh -c "npm ci && npm run build"
        profiles: ["tools"]
        
volumes:
    app-storage:
    db-data:
