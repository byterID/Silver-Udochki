name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настроить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, rdkafka, pcntl
          coverage: none
          ini-values: memory_limit=1G

      - name: Настроить Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Подготовить окружение
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing

      - name: Собрать фронтенд
        run: |
          npm ci
          npm run build

      - name: Проверить стиль кода
        run: vendor/bin/pint --test

      - name: Статический анализ
        run: vendor/bin/phpstan analyse --no-progress

      - name: Тесты
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing

      - name: Проверка docker-compose
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.monitoring.yml
          MONITORING_BIND_IP: 127.0.0.1
          MONITORING_DB_PASSWORD: ci-dummy
          DB_PASSWORD: ci-dummy
        run: docker compose config --quiet

      - name: Проверить shell-скрипты
        run: shellcheck --severity=warning docker/entrypoint.sh docker/kafka/create-topics.sh
      - name: Собрать Docker-образ
        run: docker build --target runtime -t silver-udochki-app .

      - name: Проверить, что Tailwind отработал в образе
        run: |
          docker run --rm --entrypoint sh silver-udochki-app \
            -c '! grep -q "@tailwind" /var/www/public/build/assets/*.css'

      - name: Проверить утечки секретов
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --no-banner

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://silver-udochki.ru
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Деплой
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "$TARGET" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /home/lfeanite/apps/silver-udochki

          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          # Без COMPOSE_FILE Compose не увидит docker-compose.monitoring.yml,
          # и --remove-orphans ниже удалит экспортеры как «лишние» контейнеры.
          if ! grep -q '^COMPOSE_FILE=' .env; then
            echo "В .env нет COMPOSE_FILE — сначала прогоните Ansible" >&2
            exit 1
          fi

          # Бэкап базы перед миграциями, храним 14 дней
          mkdir -p ~/backups
          docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' < /dev/null \
            | gzip > ~/backups/db_$(date +%F_%H%M).sql.gz
          find ~/backups -name 'db_*.sql.gz' -mtime +14 -delete

          # 1. Собрать новые образы. Работающие контейнеры пока не трогаем:
          #    сайт продолжает работать на старом коде.
          docker compose build

          # 2. Сначала зависимости. kafka-init (chown volume) запустится сам через depends_on.
          docker compose up -d db kafka

          # 3. Топики до воркеров. Скрипт сам ждёт, пока Kafka ответит.
          sh docker/kafka/create-topics.sh < /dev/null

          # 4. Миграции в разовом контейнере из НОВОГО образа.
          #    -T — без псевдотерминала (его нет в SSH без tty),
          #    --no-deps — db уже запущена, ничего лишнего не поднимать,
          #    --rm — удалить контейнер после выполнения.
          docker compose run --rm -T --no-deps app php artisan migrate --force < /dev/null

          # 5. Перезапустить всё на новом коде. Старый воркер получит SIGTERM,
          #    доделает задачу (stop_grace_period: 90s) и уступит место новому.
          docker compose up -d --remove-orphans

          # 6. Через 20 с убедиться, что никто не уходит в рестарты.
          sleep 20
          if [ -n "$(docker compose ps --status restarting -q)" ]; then
            echo "Есть контейнеры в рестарт-цикле:" >&2
            docker compose ps
            docker compose logs --tail 50 task-worker task-notifier scheduler
            exit 1
          fi

          docker image prune -f
          echo "Деплой завершён"
          EOF

      - name: Проверить, что сайт отвечает
        run: curl -fsS --retry 5 --retry-delay 5 -o /dev/null https://silver-udochki.ru
