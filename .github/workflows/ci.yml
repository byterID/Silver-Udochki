name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настроить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          coverage: none
          ini-values: memory_limit=1G

      - name: Настроить Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Подготовить окружение
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing

      - name: Собрать фронтенд
        run: |
          npm ci
          npm run build

      - name: Проверить стиль кода
        run: vendor/bin/pint --test

      - name: Статический анализ
        run: vendor/bin/phpstan analyse --no-progress

      - name: Тесты
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing

      - name: Собрать Docker-образ
        run: docker build --target runtime -t silver-udochki-app .

      - name: Проверить, что Tailwind отработал в образе
        run: |
          docker run --rm --entrypoint sh silver-udochki-app \
            -c '! grep -q "@tailwind" /var/www/public/build/assets/*.css'

      - name: Проверить утечки секретов
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --no-banner

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://silver-udochki.ru
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Деплой
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "$TARGET" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /apps/silver-udochki

          git pull --ff-only

          # Бэкап базы перед миграциями, храним 14 дней
          mkdir -p ~/backups
          docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
            | gzip > ~/backups/db_$(date +%F_%H%M).sql.gz
          find ~/backups -name 'db_*.sql.gz' -mtime +14 -delete

          docker compose up -d --build
          docker compose exec -T app php artisan migrate --force
          docker image prune -f
          EOF

      - name: Проверить, что сайт отвечает
        run: curl -fsS --retry 5 --retry-delay 5 -o /dev/null https://silver-udochki.ru
