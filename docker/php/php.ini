; Не сообщать версию PHP в заголовках — меньше информации для сканеров
expose_php = Off

; Ошибки — в лог, а не в ответ браузеру
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60

; Cookie сессий недоступны из JavaScript
session.cookie_httponly = On
session.use_strict_mode = On
