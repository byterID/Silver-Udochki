# Файл подключается внутри http {}, поэтому gzip можно включить здесь
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;

# ---------- HTTP: только проверка Let's Encrypt и редирект на HTTPS ----------
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.ru$request_uri;
    }
}

# ---------- HTTPS: обрываем запросы на чужие домены и голый IP ----------
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# ---------- HTTPS: сайт ----------
server {
    listen 443 ssl;
    http2 on;
    server_name example.ru www.example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # www → без www
    if ($host = www.example.ru) {
        return 301 https://example.ru$request_uri;
    }

    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    include /etc/nginx/snippets/headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Единственная точка входа PHP
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Любые другие .php исполнять запрещено
    location ~ \.php$ {
        return 404;
    }

    # Скрытые файлы (.env, .git и прочее)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Статика Vite: имена с хешем, кеш на год
    location ^~ /build/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Картинки, шрифты, загрузки из /storage: кеш на 30 дней
    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/headers.conf;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
