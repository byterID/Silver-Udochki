server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12m;

    # Не сообщаем версию nginx
    server_tokens off;

    # Базовые защитные заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Единственная точка входа PHP.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Любые другие .php исполнять запрещено.
    location ~ \.php$ {
        return 404;
    }

    # Скрытые файлы (.env, .git и прочее), кроме ACME-проверки
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Статика собранного фронтенда — с долгим кешем
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
