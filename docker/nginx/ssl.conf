server {
    listen 80 default_server;
    server_name _;
    return 444;   # молча закрыть соединение
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # не отдавать даже сертификат
    return 444;
}

# --- HTTP: только проверка certbot и редирект на HTTPS ---
server {
    listen 80;
    server_name silver-udochki.ru www.silver-udochki.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: сам сайт ---
server {
    listen 443 ssl;
    http2 on;
    server_name silver-udochki.ru www.silver-udochki.ru;

    ssl_certificate     /etc/letsencrypt/live/silver-udochki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silver-udochki.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }

    location /build/ {
        expires 1y;
        # Свой add_header отменяет заголовки уровня server, поэтому повторяем их
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}